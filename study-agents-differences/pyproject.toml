[project]
name = "study-agents-differences"
version = "0.1.0"
description = "Cross-framework comparison and benchmarking of AI agent frameworks"
requires-python = ">=3.12"

# Only DIRECT dependencies belong here. Transitive dependencies are resolved
# and pinned in `uv.lock`. Versions of the frameworks under comparison are
# pinned so benchmark runs stay reproducible.
dependencies = [
    # --- shared infrastructure -------------------------------------------
    "httpx>=0.28.1",
    "pydantic>=2.10.6",
    "pydantic-settings>=2.7.1",
    "python-dotenv>=1.0.1",
    "streamlit>=1.42.1",       # agent-ui.py
    "tavily-python>=0.5.1",    # shared web_search tool
    "tiktoken>=0.9.0",         # token counting

    # --- frameworks under comparison (pinned) ----------------------------
    "agno==1.1.8",
    "langgraph==0.2.74",
    "llama-index-core==0.12.19",
    "openai==1.63.2",
    "pydantic-ai==0.0.24",

    # --- framework integrations actually imported by the agents ----------
    "chromadb>=0.5.23",                          # agno ChromaDb + langchain Chroma
    "fastembed>=0.5.1",                          # local embeddings fallback (LangGraph)
    "huggingface-hub>=0.29.1",                   # agno HuggingFace model
    "langchain>=0.3.19",                         # create_retriever_tool, @tool
    "langchain-community>=0.3.17",               # DirectoryLoader, Chroma, FastEmbed
    "langchain-core==0.3.37",
    "langchain-huggingface==0.1.2",
    "langchain-openai==0.3.6",
    "llama-index-embeddings-openai==0.3.1",
    "llama-index-llms-azure-openai==0.3.0",
    "llama-index-llms-huggingface-api==0.3.1",
    "llama-index-llms-openai==0.3.20",
    "llama-index-readers-file==0.4.5",           # SimpleDirectoryReader
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that call external APIs and consume credentials/tokens",
]
addopts = "-m 'not integration'"
